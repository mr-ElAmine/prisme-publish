format: prisme/styles@1
styles:
  page:
    css:
      display: flex
      flex-direction: column
      gap: 24
      padding: 32
    compact:
      padding: 16
  navbar:
    css:
      display: flex
      align-items: center
      justify-content: space-between
      gap: 16
      color:
        token: brand
  heading:
    css:
      margin: 0
      font-size: 28
      font-weight: 700
  cart:
    css:
      padding: 16
      border: 1px solid
      border-color:
        token: brand
      border-radius: 12
  action:
    css:
      padding: 12px 20px
      border: none
      border-radius: 8
      background:
        token: brand
      color:
        token: surface
